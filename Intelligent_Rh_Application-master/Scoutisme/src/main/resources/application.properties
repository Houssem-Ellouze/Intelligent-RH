server.port=9009

spring.application.name=scoutisme-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-db:3306/scoutisme_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent_output=true
spring.jackson.date-format=yyyy-MM-dd

spring.cloud.config.enabled=false

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://discovery:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000
feign.client.config.default.loggerLevel=full

logging.level.org.springframework=INFO
logging.level.tn.esprit.scoutisme=DEBUG

app.services.url=${TALENT_SERVICE_URL:http://talent-management-service:9002}