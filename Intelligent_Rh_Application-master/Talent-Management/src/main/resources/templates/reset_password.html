<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Activation de votre compte</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            flex-direction: column;
        }

        /* ===== NAVBAR ===== */
        .capgemini-navbar {
            width: 100%;
            padding: 15px 40px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        .logo-img {
            height: 40px;
        }

        /* ===== MAIN CONTENT ===== */
        .wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 100px;
        }

        .container {
            width: 95%;
            max-width: 650px;
            padding: 40px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            text-align: center;
            color: #fff;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #00f5ff, #00ff9d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 15px;
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .code-box {
            margin: 25px 0;
            padding: 18px;
            border-radius: 12px;
            background: rgba(255,255,255,0.15);
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .code-box:hover {
            transform: scale(1.05);
            background: rgba(255,255,255,0.25);
        }

        .copy-msg {
            font-size: 13px;
            margin-top: 10px;
            color: #00ff9d;
            display: none;
        }

        .timer {
            margin-top: 20px;
            font-size: 14px;
            opacity: 0.8;
        }

        .footer {
            margin-top: 25px;
            font-size: 13px;
            opacity: 0.7;
        }

        @media(max-width: 600px){
            .container {
                padding: 25px;
            }

            .code-box {
                font-size: 24px;
                letter-spacing: 3px;
            }
        }
    </style>
</head>

<body>

<!-- ===== NAVBAR ===== -->
<nav class="capgemini-navbar">
    <a class="logo">
        <img
                src="https://www.capgemini.com/fr-fr/wp-content/themes/capgemini2020/assets/images/logo.svg"
                alt="Capgemini Logo"
                class="logo-img"
                loading="lazy"
        />
    </a>
</nav>

<!-- ===== CONTENT ===== -->
<div class="wrapper">
    <div class="container">

        <h1>Activation de votre compte</h1>

        <p th:text="'Bonjour ' + ${username} + ','"></p>

        <p>
            Merci pour votre inscription.<br>
            Cliquez sur le code pour le copier automatiquement :
        </p>

        <div class="code-box" id="codeBox">
            <span th:text="${resetCode}" id="resetCode"></span>
        </div>

        <div class="copy-msg" id="copyMsg">✔ Code copié !</div>

        <div class="timer" id="timer">
            Expire dans : 15:00
        </div>

        <div class="footer">
            Si vous n’êtes pas à l’origine de cette demande,
            ignorez simplement cet email.
        </div>

    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {

        const codeBox = document.getElementById("codeBox");
        const copyMsg = document.getElementById("copyMsg");
        const resetCode = document.getElementById("resetCode");

        if(codeBox && resetCode){
            codeBox.addEventListener("click", function () {
                const text = resetCode.innerText;

                if(navigator.clipboard){
                    navigator.clipboard.writeText(text);
                } else {
                    const textarea = document.createElement("textarea");
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand("copy");
                    document.body.removeChild(textarea);
                }

                copyMsg.style.display = "block";
                setTimeout(() => copyMsg.style.display = "none", 2000);
            });
        }

        // Countdown
        let time = 15 * 60;
        const timerElement = document.getElementById("timer");

        const countdown = setInterval(function () {
            let minutes = Math.floor(time / 60);
            let seconds = time % 60;
            seconds = seconds < 10 ? "0" + seconds : seconds;

            if(timerElement){
                timerElement.innerHTML = "Expire dans : " + minutes + ":" + seconds;
            }

            if (time <= 0) {
                clearInterval(countdown);
                if(timerElement){
                    timerElement.innerHTML = "⛔ Code expiré";
                }
            }

            time--;
        }, 1000);

    });
</script>

</body>
</html>
