<div class="chatbot-widget">
  <!-- Bouton flottant pour ouvrir/fermer -->
  <button
    class="chatbot-toggle"
    (click)="toggleChat()"
    [class.open]="isOpen"
    aria-label="Ouvrir le support technique">
    <svg class="chat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
    <span class="icon-close">✕</span>
    <span class="unread-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
  </button>

  <!-- Fenêtre de chat -->
  <div class="chatbot-window" [class.open]="isOpen">
    <!-- En-tête -->
    <div class="chatbot-header">
      <div class="header-content">
        <h3>Support Technique</h3>
        <p>Réponses instantanées 24/7</p>
      </div>
      <div class="header-actions">
        <button
          class="btn-icon reset-btn"
          (click)="resetChat()"
          title="Réinitialiser la conversation"
          aria-label="Réinitialiser">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8M3 8h5v5M21 12a9 9 0 0 1-9 9 9.76 9.76 0 0 1-6.74-2.74L3 16m0 0h5v-5"></path>
          </svg>
        </button>
        <button
          class="btn-icon close-btn"
          (click)="toggleChat()"
          title="Fermer"
          aria-label="Fermer le chat">
          ✕
        </button>
      </div>
    </div>

    <!-- Messages -->
    <div class="messages-container" #messagesContainer>
      <div *ngFor="let message of messages$ | async; let i = index"
           class="message-group"
           [class.user-message]="message.sender === 'user'">
        <div class="message-bubble" [class.bot]="message.sender === 'bot'">
          <p class="message-text">{{ message.text }}</p>
          <span class="message-time">{{ message.timestamp | date: 'HH:mm' }}</span>
        </div>

        <!-- Suggestions -->
        <div *ngIf="message.suggestions && message.suggestions.length > 0" class="suggestions-container">
          <button *ngFor="let suggestion of message.suggestions"
                  class="suggestion-btn"
                  (click)="clickSuggestion(suggestion.action)"
                  type="button">
            {{ suggestion.text }}
          </button>
        </div>
      </div>

      <!-- Indicateur de saisie -->
      <div *ngIf="isLoading" class="typing-indicator">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <!-- Zone de saisie -->
    <div class="input-area">
      <textarea
        [(ngModel)]="inputMessage"
        placeholder="Tapez votre question..."
        rows="1"
        class="message-input"
        [disabled]="isLoading">
      </textarea>
      <button
        class="send-button"
        (click)="sendMessage()"
        [disabled]="!inputMessage.trim() || isLoading"
        aria-label="Envoyer le message">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M16.6915026,12.4744748 L3.50612381,13.2599618 C3.19218622,13.2599618 3.03521743,13.4170592 3.03521743,13.5741566 L1.15159189,20.0151496 C0.8376543,20.8006365 0.99,21.89 1.77946707,22.52 C2.41,22.99 3.50612381,23.1 4.13399899,22.8429026 L21.714504,14.0454487 C22.6563168,13.5741566 23.1272231,12.6315722 22.9702544,11.6889879 L4.13399899,1.16емого C3.34915502,0.9 2.40734225,0.9 1.77946707,1.38570198 C0.994623095,2.0515284 0.837654326,3.1429454 1.15159189,3.92846235 L3.03521743,10.3694553 C3.03521743,10.5265527 3.34915502,10.6836501 3.50612381,10.6836501 L16.6915026,11.4691371 C16.6915026,11.4691371 17.1624089,11.4691371 17.1624089,12.0349635 C17.1624089,12.6007899 16.6915026,12.4744748 16.6915026,12.4744748 Z"></path>
        </svg>
      </button>
    </div>
  </div>
</div>
