<div class="reset-container">

  <!-- Background decorative elements -->
  <div class="decorative-element decorative-1"></div>
  <div class="decorative-element decorative-2"></div>

  <div class="cyber-element cyber-1"></div>
  <div class="cyber-element cyber-2"></div>

  <div class="light-dot" style="top: 20%; left: 15%;"></div>
  <div class="light-dot" style="top: 80%; right: 20%; animation-delay: 1s;"></div>
  <div class="light-dot" style="bottom: 30%; left: 25%; animation-delay: 2s;"></div>

  <!-- CONTENT WRAPPER (IMPORTANT) -->
  <div class="content-wrapper">

    <div *ngIf="submitted; else codeForm">

      <div class="activation-message" *ngIf="isOkay; else activationError">
        <h2>Activation Successful!</h2>
        <p>Your account has been successfully activated.</p>
        <button class="btn btn-primary" routerLink="/login">
          Go to Login
        </button>
      </div>

      <ng-template #activationError>
        <div class="activation-error">
          <h2>Activation Failed!</h2>
          <p>{{ message }}</p>
          <button class="btn btn-primary" (click)="submitted = false">
            Try again
          </button>
        </div>
      </ng-template>

    </div>

    <ng-template #codeForm>
      <div class="container text-center" style="width: 400px;">
        <h2>Type your activation code</h2>

        <code-input
          [isCodeHidden]="false"
          [codeLength]="6"
          [code]="'number'"
          (codeCompleted)="onCodeCompleted($event)">
        </code-input>

        <button class="btn btn-primary mt-3" routerLink="/login">
          Go to Login
        </button>
      </div>
    </ng-template>

  </div>
</div>
