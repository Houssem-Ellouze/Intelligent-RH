<!-- Éléments décoratifs -->
<div class="reset-container">

<div class="decorative-element decorative-1"></div>
<div class="decorative-element decorative-2"></div>
<!-- Éléments décoratifs cyberpunk -->
<div class="cyber-element cyber-1"></div>
<div class="cyber-element cyber-2"></div>

<!-- Points lumineux aléatoires -->
<div class="light-dot" style="top: 20%; left: 15%;"></div>
<div class="light-dot" style="top: 80%; right: 20%; animation-delay: 1s;"></div>
<div class="light-dot" style="bottom: 30%; left: 25%; animation-delay: 2s;"></div>

<!-- Formulaire avec dimensions exactes -->
<form (ngSubmit)="register()">
  <div class="registration-title">Inscription</div>

  <div style="grid-column: span 2; height: 20px;"></div> <!-- Espace pour le titre -->

  <label>Prénom</label>
  <input type="text" [(ngModel)]="registerRequest.nom" name="firstname" placeholder="Votre prénom" required>

  <label>Nom</label>
  <input type="text" [(ngModel)]="registerRequest.prenom" name="lastname" placeholder="Votre nom" required>

  <label>Email</label>
  <input
    type="email"
    id="email"
    name="email"
    [(ngModel)]="registerRequest.email"
    placeholder="votre@email.com"
    required
    email
  />

  <label>Mot de passe</label>
  <input type="password" [(ngModel)]="registerRequest.password" name="password" placeholder="8 caractères minimum" required minlength="8">

  <label>Téléphone</label>
  <input type="text" [(ngModel)]="registerRequest.telephone" name="phoneNumber" placeholder="Votre téléphone" required minlength="8">

  <label>Spécialité</label>
  <select id="speciality" [(ngModel)]="registerRequest.speciality" name="speciality" required>
    <option value="" disabled selected>-- Choisissez une spécialité --</option>
    <option *ngFor="let s of specialities" [value]="s">{{ s }}</option>
  </select>

  <button type="submit">
    <span>S'inscrire</span>
  </button>
</form>
</div>
