<div class="reset-container">
  <!-- Éléments décoratifs cyberpunk -->
  <div class="decorative-element decorative-1"></div>
  <div class="decorative-element decorative-2"></div>

  <div class="cyber-element cyber-1"></div>
  <div class="cyber-element cyber-2"></div>

  <!-- Points lumineux aléatoires -->
  <div class="light-dot" style="top: 20%; left: 15%;"></div>
  <div class="light-dot" style="top: 80%; right: 20%; animation-delay: 1s;"></div>
  <div class="light-dot" style="bottom: 30%; left: 25%; animation-delay: 2s;"></div>

  <!-- Carte de réinitialisation avec dimensions exactes -->
  <div class="reset-card">
    <h2 class="reset-title">🔐 Reset Your Password</h2>

    <input type="text"
           [(ngModel)]="token"
           placeholder="Enter your token"
           class="reset-input" />

    <input type="password"
           [(ngModel)]="newPassword"
           placeholder="New Password"
           class="reset-input" />

    <button (click)="resetPassword()"
            class="reset-button">
      Reset Password
    </button>

    <p *ngIf="successMessage" class="success-msg">
      {{ successMessage }}
    </p>

    <p *ngIf="errorMessage" class="error-msg">
      {{ errorMessage }}
    </p>
  </div>
</div>
