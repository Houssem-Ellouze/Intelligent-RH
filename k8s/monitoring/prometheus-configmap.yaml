apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: intelligent-rh
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'intelligent-rh-cluster'
        environment: 'production'

    # Alertmanager configuration
    alerting:
      alertmanagers:
        - static_configs:
            - targets: []

    # Règles d'alerte (à personnaliser)
    rule_files:
      # - "alerts.yml"

    scrape_configs:
      # Prometheus lui-même
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Discovery Service
      - job_name: 'discovery'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['discovery:8761']
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: 'discovery'

      # Config Server
      - job_name: 'config-server'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['config-server:8888']
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: 'config-server'

      # Gateway
      - job_name: 'gateway'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['gateway:8222']
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: 'gateway'

      # Talent Management Service
      - job_name: 'talent-management'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['talent-management-service:9002']
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: 'talent-management'

      # Recruitment Service
      - job_name: 'recruitment'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['recrutement-service:8082']
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: 'recruitment'

      # Scoutisme Service
      - job_name: 'scoutisme'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['scoutisme-service:9009']
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: 'scoutisme'

      # Kanban Backend
      - job_name: 'kanban-backend'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['kanban-backend:8088']
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: 'kanban-backend'

      # Onboarding Service
      - job_name: 'onboarding'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['admin-contract-onboarding-service:8083']
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: 'onboarding'
            
      # Kubernetes Pods (optionnel - si vous avez les permissions)
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - intelligent-rh
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
