apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: intelligent-rh
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true
      editable: true
      jsonData:
        timeInterval: "5s"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: intelligent-rh
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: 'default'
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      updateIntervalSeconds: 10
      allowUiUpdates: true
      options:
        path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-spring-boot
  namespace: intelligent-rh
data:
  spring-boot-dashboard.json: |
    {
      "dashboard": {
        "title": "Intelligent RH - Spring Boot Metrics",
        "tags": ["spring-boot", "intelligent-rh"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "JVM Memory Usage",
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
            "targets": [
              {
                "expr": "sum(jvm_memory_used_bytes{area=\"heap\"}) by (instance)",
                "legendFormat": "{{instance}} - Heap Used"
              },
              {
                "expr": "sum(jvm_memory_max_bytes{area=\"heap\"}) by (instance)",
                "legendFormat": "{{instance}} - Heap Max"
              }
            ]
          },
          {
            "id": 2,
            "title": "HTTP Request Rate",
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
            "targets": [
              {
                "expr": "rate(http_server_requests_seconds_count[5m])",
                "legendFormat": "{{instance}} - {{uri}}"
              }
            ]
          },
          {
            "id": 3,
            "title": "CPU Usage",
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
            "targets": [
              {
                "expr": "system_cpu_usage",
                "legendFormat": "{{instance}} - CPU"
              }
            ]
          },
          {
            "id": 4,
            "title": "Thread Count",
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
            "targets": [
              {
                "expr": "jvm_threads_live_threads",
                "legendFormat": "{{instance}} - Live Threads"
              }
            ]
          },
          {
            "id": 5,
            "title": "HTTP Response Time (95th percentile)",
            "type": "graph",
            "gridPos": {"h": 8, "w": 24, "x": 0, "y": 16},
            "targets": [
              {
                "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le, instance, uri))",
                "legendFormat": "{{instance}} - {{uri}}"
              }
            ]
          },
          {
            "id": 6,
            "title": "Database Connection Pool",
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 24},
            "targets": [
              {
                "expr": "hikaricp_connections_active",
                "legendFormat": "{{instance}} - Active Connections"
              },
              {
                "expr": "hikaricp_connections_idle",
                "legendFormat": "{{instance}} - Idle Connections"
              }
            ]
          },
          {
            "id": 7,
            "title": "Logback Events",
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 24},
            "targets": [
              {
                "expr": "rate(logback_events_total[5m])",
                "legendFormat": "{{instance}} - {{level}}"
              }
            ]
          }
        ],
        "refresh": "10s",
        "schemaVersion": 27,
        "version": 1
      }
    }
