apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: intelligent-rh-ingress
  namespace: intelligent-rh
  annotations:
    # Configuration CORS complète (sans snippets)
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "http://intelligent-rh, http://intelligent-rh:32000, http://intelligent-rh:30222, https://intelligent-rh"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Accept"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-max-age: "1728000"

    # Désactiver SSL redirect temporairement
    nginx.ingress.kubernetes.io/ssl-redirect: "false"

    # Taille maximale des uploads
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"

spec:
  ingressClassName: nginx
  rules:
    - host: intelligent-rh
      http:
        paths:
          # Routes API (ordre important : plus spécifique en premier)
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8222

          - path: /appointments
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8222

          - path: /calendars
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8222

          - path: /files
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8222

          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8222

          # Route Frontend (en dernier)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80